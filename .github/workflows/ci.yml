name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck / build / regression
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm ci --prefix server

      - name: Typecheck (api + src + server)
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

      - name: Build server
        run: npm run build --prefix server

      - name: Core regression (unit + integration + contract)
        run: npm test

      - name: Check inlined model core
        run: npm run check:inline

      - name: Check docs/version consistency
        run: npm run check:docs

      - name: Preview smoke
        run: npm run smoke:preview
